<!DOCTYPE html>

<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>الجدار المستدام – وسط المدينة</title>
<style>
:root{--ink:#06223f;--card:rgba(255,255,255,.88);box-sizing:border-box}
html,body{height:100%;margin:0;background:#bcd6ea;font-family:"Segoe UI",Tahoma,Arial,sans-serif;overflow:hidden}
#c{position:fixed;inset:0;width:100%;height:100%;display:block;touch-action:none;cursor:grab}
.top{position:fixed;top:0;right:0;left:0;padding:calc(10px + env(safe-area-inset-top,0px)) 14px 0;pointer-events:none;text-align:center;color:var(--ink)}
.top h1{margin:0;font-size:clamp(1.2rem,4.2vw,2rem);text-shadow:0 1px 6px #fff}
.top p{margin:2px 0 0;font-size:.82rem;text-shadow:0 1px 4px #fff}
.leg{position:fixed;bottom:calc(10px + env(safe-area-inset-bottom,0px));right:10px;background:var(--card);color:var(--ink);border-radius:14px;padding:8px 12px;font-size:.78rem;line-height:1.7;max-width:230px}
.btns{position:fixed;bottom:calc(10px + env(safe-area-inset-bottom,0px));left:10px;display:flex;flex-direction:column;gap:6px}
button{font:inherit;font-size:.85rem;border:0;border-radius:12px;padding:8px 12px;background:var(--card);color:var(--ink);cursor:pointer}
</style>
</head>
<body>
<canvas id="c"></canvas>
<div class="top"><h1>الجدار المستدام في وسط المدينة</h1><p>اسحب للتدوير · مرّر العجلة أو اقرص للتقريب</p></div>
<div class="leg"><b>مكوّنات المشروع</b><br>جدار أخضر حي على واجهة المبنى<br>نظام ري ذكي وحساسات<br>ألواح شمسية على المظلة<br>شاشة ذكية تعرض CO₂ المُزال<br>غيوم CO₂ من الشارع تُلتقط بالجدار</div>
<div class="btns"><button id="auto">إيقاف التدوير</button><button id="front">منظور أمامي</button><button id="side">منظور جانبي</button></div>
<script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
<script>

cyl(.27,4.7,0xffffff,x0,2.5,-3.5,{roughness:.03,metalness:.1,transparent:true,opacity:.22,envMapIntensity:2.2},S,24).castShadow=false;
cyl(.3,.14,0x4a4d52,x0,.2,-3.5,{metalness:.7,roughness:.4});cyl(.3,.14,0x4a4d52,x0,4.85,-3.5,{metalness:.7,roughness:.4});
for(var b=0;b<8;b++){var bb=new THREE.Mesh(new THREE.SphereGeometry(.045,8,8),new THREE.MeshBasicMaterial({color:0xeaffea}));bb.position.set(x0+(Math.random()-.5)*.2,.4+Math.random()*4.2,-3.5);bb.userData.s=.5+Math.random()*.8;S.add(bb);bubs.push(bb);}}
box(3.4,4.7,.25,0x3a3a36,2.1,2.5,-3.82);box(3.6,.45,.8,0x77776f,2.1,.4,-3.45);box(3.3,.1,.65,0x2f5d27,2.1,.67,-3.45);

for(var p=0;p<3;p++){var pg=new THREE.Group();pg.position.set(-3.9+p*2.9,5.75,-3.1);pg.rotation.x=-.32;S.add(pg);

var pt=tex(function(x,w,h){x.fillStyle='#14306e';x.fillRect(0,0,w,h);x.strokeStyle='#6f93d6';x.lineWidth=2;for(var i=0;i<=6;i++){x.beginPath();x.moveTo(i*w/6,0);x.lineTo(i*w/6,h);x.stroke();}for(var j=0;j<=4;j++){x.beginPath();x.moveTo(0,j*h/4);x.lineTo(w,j*h/4);x.stroke();}},256,160,1,1);

box(.08,1.2,.08,0x555555,-5.2,5.2,-3.1);box(.08,1.2,.08,0x555555,3.4,5.2,-3.1);

var pc=document.createElement('canvas');pc.width=512;pc.height=128;var px=pc.getContext('2d');px.fillStyle='#e9eee9';px.fillRect(0,0,512,128);px.fillStyle='#17613a';px.font='bold 54px sans-serif';px.textAlign='center';px.textBaseline='middle';px.direction='rtl';px.fillText('الجدار المستدام',256,52);px.font='26px sans-serif';px.fillText('Sustainable Wall',256,100);var pl=new THREE.CanvasTexture(pc);pl.encoding=THREE.sRGBEncoding;box(1.5,.38,.04,0,2.1,.45,-3.0,new THREE.MeshStandardMaterial({map:pl,roughness:.5}));
var pipe=cyl(.04,9,0x2b2b2b,-.6,4.98,-3.6);pipe.rotation.z=Math.PI/2;
for(var i=0;i<5;i++){box(.16,.1,.08,0xf4f4f4,-4.6+i*1.9,1.9+(i%2)*1.2,-3.58);box(.04,.04,.03,0,-4.56+i*1.9,1.93+(i%2)*1.2,-3.53,{color:0x00ff66,emissive:0x00ff66,emissiveIntensity:2});}
for(var i=0;i<14;i++)cyl(.09,.8,0x303236,-14+i*2,.58,-.35,{metalness:.5});

cyl(.28,.9,0x2f5d3a,4.6,.63,-1.9);cyl(.3,.06,0x1f3d27,4.6,1.1,-1.9);

for(var k=0;k<8;k++){var m=new THREE.Mesh(new THREE.IcosahedronGeometry(.75-(k%4)*.06,2),MAT(new THREE.Color().setHSL(.27+k*.01,.5,.28+k*.03),{roughness:.9}));m.position.set((Math.random()-.5)*1.3,2.5+(k%4)*.4+(k>3?.3:0),(Math.random()-.5)*1.3);m.castShadow=true;g.add(m);}}
[-9,-7,6.5,8.5,11].forEach(function(x){tree(x,-1.2);});

lamp(-6);lamp(5);lamp(-12);lamp(10);
box(1.6,.08,.5,0x7a5a3a,-.3,.55,-2.2);box(1.6,.5,.06,0x7a5a3a,-.3,.85,-2.45);box(.08,.4,.4,0x333333,-.9,.35,-2.2);box(.08,.4,.4,0x333333,.3,.35,-2.2);
// cars
var cars=[],cc2=[0xc0392b,0x2c5aa0,0xe8e8e8,0x2f3b3b];
for(var c=0;c<4;c++){var g=new THREE.Group();var cz=c%2?3.2:5.4;g.position.set(-14+c*7.5,0,cz);S.add(g);

[[-.85,.62],[.85,.62],[-.85,-.62],[.85,-.62]].forEach(function(w){var wh=cyl(.28,.22,0x111111,w[0],.28,w[1],{},g);wh.rotation.x=Math.PI/2;});
g.userData.v=(c%2?-1:1)*(.015+c*.003);if(c%2)g.rotation.y=Math.PI;cars.push(g);}

cyl(.2,.95,p[1],0,.95,0,{},g);cyl(.14,.55,0x2b2b3a,-.08,.28,0,{},g);cyl(.14,.55,0x2b2b3a,.08,.28,0,{},g);
var h=new THREE.Mesh(new THREE.SphereGeometry(.17,12,12),MAT(0xe0b48c));h.position.y=1.6;h.castShadow=true;g.add(h);g.userData.v=(i%2?-1:1)*.006;peds.push(g);});

function sprite(t,bg,fg,w){var c=document.createElement('canvas');c.width=256;c.height=128;var x=c.getContext('2d');x.fillStyle=bg;x.beginPath();x.ellipse(128,64,118,54,0,0,7);x.fill();x.fillStyle=fg;x.font='bold 56px sans-serif';x.textAlign='center';x.textBaseline='middle';x.fillText(t,128,68);
var s=new THREE.Sprite(new THREE.SpriteMaterial({map:new THREE.CanvasTexture(c),transparent:true,depthWrite:false}));s.scale.set(w,w/2,1);return s;}
